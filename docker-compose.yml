services:
  postgres:
    image: postgres:16-alpine
    container_name: sdgi-postgres
    environment:
      POSTGRES_USER: sdgi
      POSTGRES_PASSWORD: sdgi_dev
      POSTGRES_DB: sdgi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdgi -d sdgi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sdgi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sdgi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sdgi
      MINIO_ROOT_PASSWORD: sdgi_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: sdgi-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: sdgi-opensearch
    environment:
      - cluster.name=sdgi-dev
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

volumes:
  postgres_data:
  minio_data:
  opensearch_data:
