# DevOps Prj500 Workflow Add Or Enhance Content Approval Workflow

## Action

Follow the add-or-enhance-content-approval-workflow workflow:
1. Add or update approval-related models in schema.prisma and migration.
2. Implement approval token/signature logic (e.g., HMAC, expiry, no PII).
3. Add or update controller/service logic for approval state transitions.
4. Add or update audit logging for all approval/rejection actions.
5. Add or update tests for approval flow, token security, and edge cases.
6. Update i18n messages for approval states and user-facing copy.
7. Document the workflow in an ADR.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: apps/api/prisma/schema.prisma, apps/api/prisma/migrations/*/migration.sql, apps/api/src/{domain}/approval-*.ts

