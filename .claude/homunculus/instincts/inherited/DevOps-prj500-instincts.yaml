# DevOps Prj500 Workflow Expand I18n Locales And Messages

## Action

Follow the expand-i18n-locales-and-messages workflow:
1. Add or update message catalogs in apps/web/messages/{locale}.json for all supported locales.
2. Update locale negotiation logic in apps/web/src/i18n/routing.ts or apps/api/src/i18n/locale.middleware.ts.
3. Add new message namespaces for new features/domains.
4. Ensure plain-language and technical terms are translated or stubbed for all locales.
5. Update tests for locale negotiation and fallback logic.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: apps/web/messages/*.json, apps/web/src/i18n/routing.ts, apps/api/src/i18n/locale.middleware.ts

