# DevOps Prj500 Workflow Full Stack Feature With Equity Guardrails

## Action

Follow the full-stack-feature-with-equity-guardrails workflow:
1. Design and implement new models and migrations in schema.prisma.
2. Implement RLS (Row Level Security) and equity/safety constraints in the migration and service layer.
3. Add or update API endpoints in controller/service files.
4. Add or update i18n messages for all locales, including plain-language and safety warnings.
5. Add or update tests to verify guardrails (e.g., noncommercialNotice, harmful-content guard, K-anonymity, approval flow).
6. Document the workflow and guardrails in an ADR.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: apps/api/prisma/schema.prisma, apps/api/prisma/migrations/*/migration.sql, apps/api/src/{domain}/*.ts

