# DevOps Prj500 Workflow Add New Domain With Api And Database

## Action

Follow the add-new-domain-with-api-and-database workflow:
1. Edit apps/api/prisma/schema.prisma to add new models/tables.
2. Create a migration in apps/api/prisma/migrations/ with a timestamped folder and migration.sql.
3. Update or add seed data in apps/api/prisma/seed.ts or a new seed/*.ts file.
4. Implement new module/controller/service in apps/api/src/{domain}/ (e.g., {domain}.module.ts, {domain}.controller.ts, {domain}.service.ts).
5. Add unit/integration tests in apps/api/src/{domain}/*.spec.ts.
6. Add or update i18n message catalogs in apps/web/messages/{locale}.json for the new domain.
7. Document the design/decision in docs/adr/xxxx-{domain}.md.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: apps/api/prisma/schema.prisma, apps/api/prisma/migrations/*/migration.sql, apps/api/prisma/seed.ts

